[project]
name = "sporthealth"
version = "0.1.0"
description = "Self-hosted fitness & health data platform"
requires-python = ">=3.12"
dependencies = [
  "fastapi>=0.115",
  "uvicorn[standard]>=0.32",
  "pydantic>=2.9",
  "pydantic-settings>=2.6",
  # Pulled in now (unused until Phase 1+) so wheel selection and the AVX-masked import
  # smoke test are validated from Phase 0 onward — see docs/adr/0001-phase-0-foundations.md.
  "numpy>=2.1",
  "pyarrow>=17.0",
  "duckdb>=1.1",
  # Phase 1: raw archive, FIT parsing, schema, fit_folder adapter, merge engine.
  "garmin-fit-sdk>=21.158",
  "python-ulid>=1.1",
  "typer>=0.13",
  "polyline>=2.0",
  "alembic>=1.13",
  "sqlalchemy>=2.0",
  # Phase 2: garmin_connect adapter, scheduler, staleness webhook.
  "garminconnect>=0.3.5",
  "apscheduler>=3.10",
  "httpx>=0.27",
  "mcp>=1.9,<2",
  "pyjwt>=2.9,<3",
]

[project.scripts]
sync = "sporthealth.cli:app"

[dependency-groups]
dev = [
  "ruff>=0.7",
  "mypy>=1.13",
  "pytest>=8.3",
  "pytest-asyncio>=0.24",
  "fitdecode>=0.10",
  "hypothesis>=6.115",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/sporthealth"]

[tool.ruff]
line-length = 100
target-version = "py312"
src = ["src", "tests"]
# Auto-generated by `alembic revision --autogenerate`; only the data-seed portion is
# hand-written. Linting generated DDL boilerplate isn't worth the noise.
extend-exclude = ["alembic/versions"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM", "RUF"]

[tool.ruff.lint.flake8-bugbear]
# FastAPI's own canonical idiom is `param: X = Depends(...)`/`Query(...)` in a signature
# default -- B008 exists to catch accidental mutable-default bugs, not this well-established,
# framework-blessed pattern. See https://fastapi.tiangolo.com/tutorial/dependencies/.
extend-immutable-calls = ["fastapi.Depends", "fastapi.Query", "fastapi.Header"]

[tool.mypy]
python_version = "3.12"
strict = true
files = ["src", "tests"]

[[tool.mypy.overrides]]
# pyarrow, garmin_fit_sdk, polyline, fitdecode ship no py.typed marker / stubs as of this
# writing.
module = [
  "pyarrow.*",
  "garmin_fit_sdk.*",
  "polyline.*",
  "fitdecode.*",
  "garminconnect.*",
  "apscheduler.*",
]
ignore_missing_imports = true

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra"
# MCP tool functions (api/mcp_server.py) are async -- auto mode means `async def test_*`
# just works without a per-test @pytest.mark.asyncio, matching how the rest of this project
# avoids ceremony where it can.
asyncio_mode = "auto"
