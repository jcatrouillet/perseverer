# Auto-merged by `compose up`: publishes the dev ports on localhost, taken from perseverer.env
# when Compose is run with `--env-file perseverer.env`. Rebuild after code changes with
# `docker compose --env-file perseverer.env up --build` (or `podman compose ...`).

services:
  api:
    ports:
      - "${PERSEVERER_HOST_API_PORT:-8000}:8000"

  frontend:
    ports:
      - "${PERSEVERER_HOST_FRONTEND_PORT:-8080}:80"
