# Auto-merged by a plain `compose up` invocation — this is the Windows/Podman Desktop dev
# shape (works identically with `docker compose` if you ever switch back — this file has no
# engine-specific extensions). Only publishes ports to localhost. Rebuild after code changes
# with `podman compose up --build`;
# live-reload via bind-mounted source + editable install is deferred until daily iteration
# speed actually matters, not added speculatively.

services:
  api:
    ports:
      - "${DEV_API_PUBLISHED_PORT:-8008}:8000"

  frontend:
    ports:
      - "${DEV_FRONTEND_PUBLISHED_PORT:-5173}:80"
