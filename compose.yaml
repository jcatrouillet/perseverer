name: sporthealth

# Base service definitions. No ports published and no bind mounts here — see
# compose.override.yml (dev/Windows, auto-merged) and compose.nas.yml (NAS, applied via -f).
#
# `image:` here is a purely local build tag — GHCR_IMAGE_PREFIX/IMAGE_TAG are deliberately
# NOT referenced in this file. They only apply in compose.nas.yml, which overrides `image:`
# entirely for the pull-only NAS deploy. (An earlier version used
# `${GHCR_IMAGE_PREFIX:-sporthealth-api}:${IMAGE_TAG:-local}` here — the `:-default` fallback
# only kicks in when the variable is fully unset, so once .env sets GHCR_IMAGE_PREFIX for the
# NAS, all three services silently collapsed onto the same image name. Decoupling local
# build tags from the registry prefix avoids that whole bug class.)

services:
  api:
    build:
      context: .
      dockerfile: docker/api.Dockerfile
    image: sporthealth-api:local
    restart: unless-stopped
    environment:
      SPORTHEALTH_ENVIRONMENT: ${SPORTHEALTH_ENVIRONMENT:-development}
      SPORTHEALTH_LOG_LEVEL: ${SPORTHEALTH_LOG_LEVEL:-INFO}
      SPORTHEALTH_API_PORT: ${SPORTHEALTH_API_PORT:-8000}
      SPORTHEALTH_DATA_DIR: ${SPORTHEALTH_DATA_DIR:-/data}
    volumes:
      - sporthealth-data:/data
    healthcheck:
      test:
        - CMD
        - python
        - -c
        - import urllib.request; urllib.request.urlopen('http://localhost:8000/api/v1/healthz', timeout=3)
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 10s

  worker:
    build:
      context: .
      dockerfile: docker/worker.Dockerfile
    image: sporthealth-worker:local
    restart: unless-stopped
    environment:
      SPORTHEALTH_ENVIRONMENT: ${SPORTHEALTH_ENVIRONMENT:-development}
      SPORTHEALTH_LOG_LEVEL: ${SPORTHEALTH_LOG_LEVEL:-INFO}
      SPORTHEALTH_DATA_DIR: ${SPORTHEALTH_DATA_DIR:-/data}
    volumes:
      - sporthealth-data:/data

  frontend:
    build:
      context: .
      dockerfile: docker/frontend.Dockerfile
    image: sporthealth-frontend:local
    restart: unless-stopped

volumes:
  sporthealth-data:
