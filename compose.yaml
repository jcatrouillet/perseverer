name: perseverer

# The full stack for the dev host (Docker or Podman Compose). Every service reads the one
# configuration file, perseverer.env; pass it for port interpolation too:
#   docker compose --env-file perseverer.env up --build
# compose.override.yml (auto-merged) publishes the ports. Production uses systemd Quadlet units
# rendered from the same file (scripts/install-production.sh) — see docs/DEPLOY.md. Local images
# are tagged `perseverer-<service>:local`; the images set PERSEVERER_DATA_DIR=/data themselves.

services:
  api:
    build:
      context: .
      dockerfile: docker/api.Dockerfile
    image: perseverer-api:local
    restart: unless-stopped
    env_file: perseverer.env
    volumes:
      - perseverer-data:/data
    healthcheck:
      test:
        - CMD
        - python
        - -c
        - import urllib.request; urllib.request.urlopen('http://localhost:8000/api/v1/healthz', timeout=3)
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 10s
    # Hardening -- mirrors quadlet/perseverer-api.container's
    # ReadOnly=true/ReadOnlyTmpfs=true/NoNewPrivileges=true, verified here first since Compose
    # is the dev host's own deploy path and the production Quadlet units are
    # the one place this can't be trial-and-errored against live data. Standard Compose Spec
    # syntax, not a Podman-specific flag, so this works identically under `docker compose` too
    # per this file's own header comment -- Compose has no equivalent of Podman CLI's
    # --read-only-tmpfs auto-default, so the tmpfs mounts are listed explicitly rather than
    # relying on an implementation-specific default.
    read_only: true
    tmpfs:
      - /tmp
      - /run
      - /var/tmp
    security_opt:
      - no-new-privileges:true

  worker:
    build:
      context: .
      dockerfile: docker/worker.Dockerfile
    image: perseverer-worker:local
    restart: unless-stopped
    env_file: perseverer.env
    volumes:
      - perseverer-data:/data
    # See the api service's own comment above -- same reasoning, mirrors
    # quadlet/perseverer-worker.container.
    read_only: true
    tmpfs:
      - /tmp
      - /run
      - /var/tmp
    security_opt:
      - no-new-privileges:true

  frontend:
    build:
      context: .
      dockerfile: docker/frontend.Dockerfile
    image: perseverer-frontend:local
    restart: unless-stopped
    # config.js and the nginx upstream (PERSEVERER_HOST_API_PORT) are rendered from this at
    # container start -- see docker/frontend-entrypoint.d and docker/nginx.conf.template.
    env_file: perseverer.env
    # nginx reaches the API through the host's published port; Podman provides this name
    # natively, Docker needs it mapped to the host gateway.
    extra_hosts:
      - "host.containers.internal:host-gateway"

volumes:
  perseverer-data:
