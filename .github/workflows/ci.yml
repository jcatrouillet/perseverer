name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v3
        with:
          enable-cache: true
      - run: uv python install 3.12
      - run: uv sync --frozen --all-groups
      - run: uv run ruff check .
      - run: uv run mypy

  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v3
        with:
          enable-cache: true
      - run: uv python install 3.12
      - run: uv sync --frozen --all-groups
      - run: uv run pytest -q

  frontend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: "npm"
          cache-dependency-path: frontend/package-lock.json
      - run: npm ci
      - run: npm run typecheck
      - run: npm run build

  avx-smoke:
    # The DS1019+ (Celeron J3455 / Goldmont) has SSE4.2 but no AVX/AVX2. GitHub-hosted runners
    # are AVX2-capable, so we can't rely on the runner's real hardware to catch a dependency
    # compiled for x86-64-v3. Instead we run the same import/basic-op smoke test under
    # `qemu-x86_64 -cpu Westmere` — Westmere has SSE4.2 (and AES-NI, also present on Goldmont)
    # but no AVX, closely matching the real target. `-cpu qemu64` (tried first) is QEMU's
    # generic baseline and turned out to lack even SSE4.1/SSE4.2 by default, well *below* the
    # real NAS CPU's actual capability — every push SIGILL'd on numpy's own baseline dispatch
    # code, a false alarm unrelated to the AVX/AVX2 question this gate exists to answer. See
    # docs/adr/0001-phase-0-foundations.md decision 5 for the corrected CPU model choice.
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v3
        with:
          enable-cache: true
      - run: uv python install 3.12
      - run: uv sync --frozen --all-groups
      - name: Install qemu-user (same-arch CPU-feature emulation, not cross-arch)
        run: sudo apt-get update && sudo apt-get install -y qemu-user qemu-user-static
      - name: Run AVX-sensitive-import smoke test under an AVX-less, SSE4.2-capable CPU model
        run: |
          set -euo pipefail
          PYBIN="$(uv run python -c 'import sys; print(sys.executable)')"
          qemu-x86_64 -cpu Westmere "$PYBIN" -m pytest tests/test_avx_smoke.py -q

  build-and-push:
    name: build-and-push (${{ matrix.image }})
    # Gated on every quality job, not just its own Dockerfile building -- an image nobody
    # tested the contents of isn't worth publishing just because `docker build` succeeded.
    needs: [lint, test, frontend, avx-smoke]
    runs-on: ubuntu-latest
    permissions:
      contents: read
      # Explicit here because the workflow-level default above is contents:read only --
      # confirmed this overrides the repo's own default_workflow_permissions=read setting
      # rather than needing that changed, so pushing to GHCR needed no account-settings change.
      packages: write
    strategy:
      matrix:
        include:
          - image: api
            dockerfile: docker/api.Dockerfile
          - image: worker
            dockerfile: docker/worker.Dockerfile
          - image: frontend
            dockerfile: docker/frontend.Dockerfile
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      # Builds on every push and PR (catches a broken Dockerfile before merge) but only logs in
      # and pushes for a real push to main -- never publish an image built from an unmerged PR.
      - if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - uses: docker/build-push-action@v6
        with:
          context: .
          file: ${{ matrix.dockerfile }}
          platforms: linux/amd64
          push: ${{ github.event_name == 'push' && github.ref == 'refs/heads/main' }}
          # bercy's Quadlet units (quadlet/*.container) pull :latest and rely on
          # AutoUpdate=registry to pick up a new digest -- sha-<commit> is for traceability/
          # manual rollback, not something anything currently deploys by tag.
          tags: |
            ghcr.io/${{ github.repository_owner }}/perseverer-${{ matrix.image }}:latest
            ghcr.io/${{ github.repository_owner }}/perseverer-${{ matrix.image }}:sha-${{ github.sha }}
          cache-from: type=gha,scope=${{ matrix.image }}
          cache-to: type=gha,mode=max,scope=${{ matrix.image }}
