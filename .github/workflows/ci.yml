name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v3
        with:
          enable-cache: true
      - run: uv python install 3.12
      - run: uv sync --frozen --all-groups
      - run: uv run ruff check .
      - run: uv run ruff format --check .
      - run: uv run mypy
      # Phase 9 hardening (ADR 0014): fails the build on a known-vulnerable pinned dependency.
      # Zero findings as of this writing (confirmed by running it before wiring it in) -- no
      # allowlist mechanism exists yet because there's nothing to allowlist; add one
      # (`--ignore-vuln <id>`, with a one-line reason) if a real, currently-unfixable advisory
      # ever needs to be accepted rather than blocking every push.
      - run: uv run pip-audit

  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v3
        with:
          enable-cache: true
      - run: uv python install 3.12
      - run: uv sync --frozen --all-groups
      - run: uv run pytest -q

  frontend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: "npm"
          cache-dependency-path: frontend/package-lock.json
      - run: npm ci
      - run: npm run typecheck
      - run: npm run format:check
      - run: npm test
      - run: npm run build
      # Phase 9 hardening (ADR 0014) -- see the lint job's pip-audit step for the same reasoning
      # (zero findings as of this writing, no allowlist needed yet).
      - run: npm audit --audit-level=high

  avx-smoke:
    # The DS1019+ (Celeron J3455 / Goldmont) has SSE4.2 but no AVX/AVX2. GitHub-hosted runners
    # are AVX2-capable, so we can't rely on the runner's real hardware to catch a dependency
    # compiled for x86-64-v3. Instead we run the same import/basic-op smoke test under
    # `qemu-x86_64 -cpu Westmere` — Westmere has SSE4.2 (and AES-NI, also present on Goldmont)
    # but no AVX, closely matching the real target. `-cpu qemu64` (tried first) is QEMU's
    # generic baseline and turned out to lack even SSE4.1/SSE4.2 by default, well *below* the
    # real NAS CPU's actual capability — every push SIGILL'd on numpy's own baseline dispatch
    # code, a false alarm unrelated to the AVX/AVX2 question this gate exists to answer. See
    # docs/adr/0001-phase-0-foundations.md decision 5 for the corrected CPU model choice.
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v3
        with:
          enable-cache: true
      - run: uv python install 3.12
      - run: uv sync --frozen --all-groups
      - name: Install qemu-user (same-arch CPU-feature emulation, not cross-arch)
        run: sudo apt-get update && sudo apt-get install -y qemu-user qemu-user-static
      - name: Run AVX-sensitive-import smoke test under an AVX-less, SSE4.2-capable CPU model
        run: |
          set -euo pipefail
          PYBIN="$(uv run python -c 'import sys; print(sys.executable)')"
          qemu-x86_64 -cpu Westmere "$PYBIN" -m pytest tests/test_avx_smoke.py -q

  backup-restore:
    # Phase 9 acceptance criterion (ADR 0014): an automated restore-from-backup test in CI.
    # `sync backup create --destination`/`sync backup restore` both take a plain local path here
    # instead of a real SSH host -- rsync treats a local path and a `user@host:path` spec
    # identically (backup.py's own docstring), so this exercises the exact same code the real
    # scheduled job runs, just with no LAN/SSH host for a CI runner to reach anyway. rsync ships
    # preinstalled on GitHub's ubuntu-latest image; this is the one place in CI that actually
    # depends on that (tests/test_backup.py itself mocks rsync out, since it isn't installed in
    # every dev environment this suite runs in -- confirmed absent on Windows/Git Bash).
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v3
        with:
          enable-cache: true
      - run: uv python install 3.12
      - run: uv sync --frozen --all-groups
      - name: Import a real fixture, back it up, wipe the data dir, restore, and verify
        run: |
          set -euo pipefail
          data_dir="$(mktemp -d)/data"
          backup_dest="$(mktemp -d)/backup"
          export PERSEVERER_DATA_DIR="$data_dir"

          uv run alembic upgrade head
          uv run sync import fit-folder tests/fixtures/fit

          count_activities() {
            uv run python -c "import sqlite3; print(sqlite3.connect('$1').execute('SELECT COUNT(*) FROM activity').fetchone()[0])"
          }
          before_count=$(count_activities "$data_dir/perseverer.db")
          before_raw=$(find "$data_dir/raw" -type f | sed "s#$data_dir/raw/##" | sort)
          echo "before: $before_count activities, $(echo "$before_raw" | wc -l) raw files"

          mkdir -p "$backup_dest"
          uv run sync backup create --destination "$backup_dest"

          # Simulate total local loss -- the actual restore scenario this test exists for.
          rm -rf "$data_dir"

          uv run sync backup restore "$backup_dest" --yes

          after_count=$(count_activities "$data_dir/perseverer.db")
          after_raw=$(find "$data_dir/raw" -type f | sed "s#$data_dir/raw/##" | sort)
          echo "after: $after_count activities, $(echo "$after_raw" | wc -l) raw files"

          if [ "$before_count" != "$after_count" ]; then
            echo "MISMATCH: $before_count activities before wipe, $after_count after restore"
            exit 1
          fi
          if [ "$before_raw" != "$after_raw" ]; then
            echo "MISMATCH: raw archive file listing differs after restore"
            diff <(echo "$before_raw") <(echo "$after_raw") || true
            exit 1
          fi

  build-and-push:
    name: build-and-push (${{ matrix.image }})
    # Gated on every quality job, not just its own Dockerfile building -- an image nobody
    # tested the contents of isn't worth publishing just because `docker build` succeeded.
    needs: [lint, test, frontend, avx-smoke, backup-restore]
    runs-on: ubuntu-latest
    permissions:
      contents: read
      # Explicit here because the workflow-level default above is contents:read only --
      # confirmed this overrides the repo's own default_workflow_permissions=read setting
      # rather than needing that changed, so pushing to GHCR needed no account-settings change.
      packages: write
    strategy:
      matrix:
        include:
          - image: api
            dockerfile: docker/api.Dockerfile
          - image: worker
            dockerfile: docker/worker.Dockerfile
          - image: frontend
            dockerfile: docker/frontend.Dockerfile
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      # Builds on every push and PR (catches a broken Dockerfile before merge) but only logs in
      # and pushes for a real push to main -- never publish an image built from an unmerged PR.
      - if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - uses: docker/build-push-action@v6
        with:
          context: .
          file: ${{ matrix.dockerfile }}
          platforms: linux/amd64
          push: ${{ github.event_name == 'push' && github.ref == 'refs/heads/main' }}
          # bercy's Quadlet units (quadlet/*.container) pull :latest and rely on
          # AutoUpdate=registry to pick up a new digest -- sha-<commit> is for traceability/
          # manual rollback, not something anything currently deploys by tag.
          tags: |
            ghcr.io/${{ github.repository_owner }}/perseverer-${{ matrix.image }}:latest
            ghcr.io/${{ github.repository_owner }}/perseverer-${{ matrix.image }}:sha-${{ github.sha }}
          cache-from: type=gha,scope=${{ matrix.image }}
          cache-to: type=gha,mode=max,scope=${{ matrix.image }}
