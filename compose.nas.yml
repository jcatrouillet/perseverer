# Applied explicitly on the DS1019+:
#   docker compose -f compose.yaml -f compose.nas.yml pull
#   docker compose -f compose.yaml -f compose.nas.yml up -d
# Never pass --build here — images are built on Windows/CI and pulled from GHCR (§4b).
# No ports are published to the host: the DSM reverse proxy is the sole ingress (§7).

services:
  api:
    image: ${GHCR_IMAGE_PREFIX}-api:${IMAGE_TAG:-latest}
    user: "${NAS_UID}:${NAS_GID}"
    volumes:
      - ${NAS_DATA_DIR}:/data
    mem_limit: 512m

  worker:
    image: ${GHCR_IMAGE_PREFIX}-worker:${IMAGE_TAG:-latest}
    user: "${NAS_UID}:${NAS_GID}"
    volumes:
      - ${NAS_DATA_DIR}:/data
    # Ingestion must never starve the API or DSM itself — keep the nightly sync single-threaded.
    cpus: 1.0
    mem_limit: 512m

  frontend:
    image: ${GHCR_IMAGE_PREFIX}-frontend:${IMAGE_TAG:-latest}
    mem_limit: 128m
