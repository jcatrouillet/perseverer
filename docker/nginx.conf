server {
    listen 80;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;

    # Pre-compressed assets are generated at build time (Phase 5+ Vite build). On-the-fly
    # compression is a bad use of the DS1019+'s Celeron J3455 — see project spec §4b.
    # gzip_static serves the original file untouched when no .gz sibling exists yet.
    gzip_static on;
    gzip_vary on;

    # The reverse proxy in front of this container splits frontend/API by *port*, not path
    # (see docs/DEPLOY.md) -- a share link (api/routers/share.py) needs to resolve on this same
    # origin for a usable, memorable URL, so this one path is forwarded to the API container
    # instead of falling through to the SPA's own index.html like everything else here.
    # host.containers.internal is rootless Podman's built-in host-gateway alias -- reaches the
    # API container's host-published port with no shared Podman network/Quadlet change needed.
    location /share/ {
        proxy_pass http://host.containers.internal:8000;
        proxy_set_header Host $host;
    }

    location / {
        try_files $uri $uri/ /index.html;
    }
}
